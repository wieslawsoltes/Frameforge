name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verify source and bundled media integrity
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          const manifest=JSON.parse(fs.readFileSync('SOURCE_SHA256.json','utf8'));
          for(const [path,expected] of Object.entries(manifest)) assert.equal(createHash('sha256').update(fs.readFileSync(path)).digest('hex'),expected,path);
          for(const path of ['src/app.js','styles.css','assets/weightless.wav','tests/gpu-smoke.html']) assert.ok(fs.existsSync(path),path);
          console.log('Source and generated-media integrity checks passed.');
          JS
      - name: Validate edit kernel
        run: npm test
      - name: Build standalone distribution
        run: npm run build
      - name: Assemble public site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/assets _site/tests
          cp index.html styles.css Frameforge.html LICENSE THIRD_PARTY_NOTICES.md _site/
          cp -R src _site/src
          find assets -maxdepth 1 -type f \( -name '*.jpg' -o -name '*.mp4' -o -name '*.wav' -o -name '*.svg' -o -name '*.json' \) -exec cp '{}' _site/assets/ \;
          cp tests/gpu-smoke.html _site/tests/
          touch _site/.nojekyll
          printf '{"commit":"%s","run":"%s"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > _site/build-info.json
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read Pages configuration
        uses: actions/configure-pages@v5
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FRAMEFORGE_BASE_URL: ${{ needs.deploy.outputs.page_url }}
      EXPECTED_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install browser verification tools
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify published editor, playback, editing and persistence
        run: python tests/pages-smoke.py
      - name: Upload hosted-browser verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-browser-verification
          path: test-output/
          if-no-files-found: warn
