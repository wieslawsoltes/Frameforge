name: Assemble original source and demo assets
on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: frameforge-source-import
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Assemble and verify original application source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/app-{1,2,3,4,5}.txt > src/app.js
          cat .bootstrap/style-{1,2,3}.txt > styles.css
          echo '705255c983558c66cada337fa5d0a8c5a39bcdb06d2abf6c71f0afce9a89aa4b  src/app.js' | sha256sum --check --strict
          echo 'b525c6d6fd18d3ca9d45f955b141f6f002c99a8a7f58a2d80cab05f3b519d711  styles.css' | sha256sum --check --strict
          for file in src/*.js; do node --check "$file"; done
          mkdir -p validation
          npm test | tee validation/unit-tests.txt
      - name: Install demo rendering tools
        shell: bash
        run: |
          set -euo pipefail
          command -v ffmpeg || { sudo apt-get update; sudo apt-get install -y ffmpeg; }
          python3 -m venv "$RUNNER_TEMP/frameforge-demo-env"
          "$RUNNER_TEMP/frameforge-demo-env/bin/pip" install numpy pillow scipy basemap-data
      - name: Render original demo videos and synthesize soundtrack
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/frameforge-demo-env/bin/python" assets/build-demo.py
          npm run build
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {createDemo,validateProject} from './src/core.js';
          const project=validateProject(createDemo());
          for(const asset of project.assets) if(asset.path && !fs.existsSync(asset.path)) throw new Error('Missing asset: '+asset.path);
          console.log('All demo sources are present.');
          JS
      - name: Commit complete source and generated media without rewriting history
        shell: bash
        run: |
          set -euo pipefail
          git rm -r .bootstrap
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const paths=['index.html','styles.css','package.json','server.mjs','build.mjs','Frameforge.html','LICENSE','THIRD_PARTY_NOTICES.md'];
          for(const dir of ['src','assets','tests','validation']) for(const name of fs.readdirSync(dir)) {const path=dir+'/'+name;if(fs.statSync(path).isFile()) paths.push(path);}
          const manifest=Object.fromEntries(paths.sort().map(path=>[path,createHash('sha256').update(fs.readFileSync(path)).digest('hex')]));
          fs.writeFileSync('SOURCE_SHA256.json',JSON.stringify(manifest,null,2)+'\n');
          JS
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app.js styles.css assets Frameforge.html SOURCE_SHA256.json validation/unit-tests.txt
          git commit -m "Complete Frameforge source import and generate original demo media"
          git push origin HEAD:main
          printf '## Source import complete\n\nCommitted complete editor, original demo media, standalone build, and integrity manifest.\n\nCommit: `%s`\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
